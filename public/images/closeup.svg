<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- timing: this picture runs 6.5 seconds; five slow bites land at 0.6, 1.9, 3.2, 4.5 and 5.8 s -->
  <style>
    .jaw    { animation: chew 1.3s ease-in-out infinite; animation-delay: -0.05s; }
    .flower { animation: eaten 6.5s linear forwards; transform-box: view-box; transform-origin: 300px 440px; }
    .lids   { animation: blink 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .glow   { animation: burn 1.3s ease-in-out infinite alternate; }
    .drip   { animation: drip 2.6s ease-in infinite; }
    .drip2  { animation: drip 2.6s 1.3s ease-in infinite; }
    .curlL  { animation: hang 2.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0%; }
    .curlR  { animation: hang 2.4s ease-in-out infinite alternate-reverse; transform-box: fill-box; transform-origin: 50% 0%; }
    @keyframes chew  { 0%, 35% { transform: translateY(34px); } 50% { transform: translateY(0); } 62% { transform: translateY(4px); } 100% { transform: translateY(34px); } }
    /* each bite takes a chunk; between bites the plant is pulled slowly into the mouth */
    @keyframes eaten {
      0%     { transform: translate(0, 0) scale(1); }
      9%     { transform: translate(-4px, -4px) scale(1); }
      9.5%   { transform: translate(-4px, -4px) scale(.8); }
      29%    { transform: translate(-8px, -8px) scale(.8); }
      29.5%  { transform: translate(-8px, -8px) scale(.62); }
      49%    { transform: translate(-12px, -12px) scale(.62); }
      49.5%  { transform: translate(-12px, -12px) scale(.45); }
      69%    { transform: translate(-16px, -16px) scale(.45); }
      69.5%  { transform: translate(-16px, -16px) scale(.28); }
      89%    { transform: translate(-18px, -18px) scale(.28); }
      89.5%, 100% { transform: translate(-18px, -18px) scale(0); }
    }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(0); } 94% { transform: scaleY(1); } }
    @keyframes burn  { from { opacity: .55; } to { opacity: 1; } }
    @keyframes drip  { from { transform: translateY(0); opacity: 1; } 80% { opacity: 1; } to { transform: translateY(110px); opacity: 0; } }
    @keyframes hang  { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
  </style>
  <defs>
    <radialGradient id="shadow" cx="50%" cy="70%" r="65%">
      <stop offset="0" stop-color="#2c2220"/><stop offset="0.6" stop-color="#140e0e"/><stop offset="1" stop-color="#050303"/>
    </radialGradient>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd23a" stop-opacity="0.9"/><stop offset="1" stop-color="#ff3a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glove" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa8c4"/>
    </radialGradient>
    <linearGradient id="lobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e01a20"/><stop offset="1" stop-color="#6f9b2c"/>
    </linearGradient>
    <clipPath id="faceclip"><path d="M168 200 C160 330 190 470 300 560 C410 470 440 330 432 200 Z"/></clipPath>
  </defs>

  <!-- long black curls hanging out from under the hat -->
  <g fill="none" stroke="#ff3cac" stroke-opacity="0.45" stroke-width="21" stroke-linecap="round">
    <path class="curlL" d="M150 200 C130 280 150 340 126 420 C116 456 136 480 120 506"/>
    <path class="curlL" d="M182 210 C170 290 190 350 170 430 C162 466 182 486 168 520"/>
    <path class="curlR" d="M450 200 C470 280 450 340 474 420 C484 456 464 480 480 506"/>
    <path class="curlR" d="M418 210 C430 290 410 350 430 430 C438 466 418 486 432 520"/>
  </g>
  <g fill="none" stroke="#050505" stroke-width="16" stroke-linecap="round">
    <path class="curlL" d="M150 200 C130 280 150 340 126 420 C116 456 136 480 120 506"/>
    <path class="curlL" d="M182 210 C170 290 190 350 170 430 C162 466 182 486 168 520"/>
    <path class="curlR" d="M450 200 C470 280 450 340 474 420 C484 456 464 480 480 506"/>
    <path class="curlR" d="M418 210 C430 290 410 350 430 430 C438 466 418 486 432 520"/>
  </g>

  <!-- the face, lost in shadow, with a pink rim of disco light -->
  <path d="M168 200 C160 330 190 470 300 560 C410 470 440 330 432 200 Z" fill="url(#shadow)" stroke="#ff3cac" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- glowing eyes in the dark -->
  <g class="glow">
    <ellipse cx="240" cy="282" rx="52" ry="30" fill="url(#eyeglow)"/>
    <ellipse cx="360" cy="282" rx="52" ry="30" fill="url(#eyeglow)"/>
  </g>
  <path d="M212 284 Q240 266 268 284 Q240 296 212 284 Z" fill="#ffe680"/>
  <path d="M332 284 Q360 266 388 284 Q360 296 332 284 Z" fill="#ffe680"/>
  <ellipse cx="240" cy="284" rx="3.5" ry="9" fill="#2a0000"/>
  <ellipse cx="360" cy="284" rx="3.5" ry="9" fill="#2a0000"/>
  <g class="lids" fill="#140e0e">
    <rect x="206" y="262" width="68" height="40"/>
    <rect x="326" y="262" width="68" height="40"/>
  </g>

  <!-- the mouth -->
  <path d="M236 432 C260 420 340 420 364 432 L364 480 C340 498 260 498 236 480 Z" fill="#3a0008"/>
  <path d="M244 430 l8 20 l8 -18 l8 20 l8 -20 l8 20 l8 -20 l8 20 l8 -20 l8 20 l8 -20 l8 20 l8 -18 l8 18 l2 -12" fill="#f4ecd6" stroke="#6b5a3a" stroke-width="1"/>

  <!-- the flytrap, held in the glove, going in bite by bite -->
  <g class="flower">
    <path d="M300 444 C340 470 380 500 410 560" stroke="#5c8a22" stroke-width="9" fill="none"/>
    <path d="M300 444 C268 430 258 400 272 378 C290 392 300 418 300 444 Z" fill="url(#lobe)" stroke="#1f3a0c" stroke-width="2"/>
    <path d="M300 444 C330 436 346 410 336 386 C318 398 304 420 300 444 Z" fill="url(#lobe)" stroke="#1f3a0c" stroke-width="2"/>
    <path d="M272 378 l-6 -8 M278 390 l-9 -4 M284 404 l-10 -1 M336 386 l5 -9 M332 398 l9 -3 M324 412 l10 0" stroke="#e9f2c8" stroke-width="2" stroke-linecap="round"/>
    <path d="M360 494 C380 480 400 486 404 500 C388 506 372 504 360 494 Z" fill="#6f9b2c" stroke="#1f3a0c"/>
  </g>
  <!-- green juice dripping off the chin -->
  <path class="drip" d="M262 492 C258 504 258 512 262 516 C266 512 266 504 262 492 Z" fill="#7cff3a"/>
  <path class="drip2" d="M338 494 C334 506 334 514 338 518 C342 514 342 506 338 494 Z" fill="#7cff3a"/>

  <!-- the chin and lower teeth, chewing slowly -->
  <g clip-path="url(#faceclip)"><g class="jaw">
    <path d="M236 470 C260 488 340 488 364 470 L374 560 L226 560 Z" fill="url(#shadow)"/>
    <path d="M246 474 l8 -16 l8 14 l8 -16 l8 16 l8 -16 l8 16 l8 -16 l8 16 l8 -16 l8 16 l8 -16 l8 14 l8 -14 l6 12" fill="#e8dfc4" stroke="#6b5a3a" stroke-width="1"/>
  </g></g>

  <!-- the sparkly glove holding the plant -->
  <g>
    <ellipse cx="416" cy="560" rx="40" ry="32" fill="url(#glove)" stroke="#6f7f9f" stroke-width="2"/>
    <path d="M384 556 C392 536 410 530 418 544 M398 566 C404 544 424 538 432 552" stroke="#6f7f9f" stroke-width="2" fill="none"/>
    <g fill="#ffffff" stroke="#9fd8ff">
      <path class="glow" d="M440 548 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/>
      <path class="glow" d="M402 590 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/>
    </g>
  </g>

  <!-- the fedora brim, low and huge -->
  <g transform="rotate(-6 300 190)">
    <path d="M150 196 C150 90 200 40 300 40 C400 40 450 90 450 196 Z" fill="#0b0b0b"/>
    <path d="M300 44 C290 90 292 140 300 176" stroke="#222" stroke-width="5" fill="none"/>
    <rect x="152" y="160" width="296" height="28" fill="#1c1c1c"/>
    <ellipse cx="300" cy="200" rx="296" ry="44" fill="#0b0b0b" stroke="#ff3cac" stroke-width="2" stroke-opacity="0.5"/>
  </g>
</svg>
