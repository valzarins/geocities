<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
  <style>
    .bob   { animation: bob 1.1s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 200px 520px; }
    .hat   { animation: tilt 0.9s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 200px 150px; }
    .hairL { animation: swayL 0.7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 0%; }
    .hairR { animation: swayR 0.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 0%; }
    .armL  { animation: grabL 0.5s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 140px 330px; }
    .armR  { animation: grabR 0.55s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 260px 330px; }
    .upper { animation: upper 0.32s ease-in-out infinite alternate; }
    .lower { animation: lower 0.32s ease-in-out infinite alternate; }
    .eye   { animation: glow 0.6s ease-in-out infinite alternate; }
    .pupil { animation: dart 1.7s steps(1) infinite; }
    .snap1 { animation: snap 0.4s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 262px 128px; }
    .snap2 { animation: snap2 0.4s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 262px 128px; }
    @keyframes bob   { from { transform: translateY(0) rotate(-1.5deg); } to { transform: translateY(-8px) rotate(1.5deg); } }
    @keyframes tilt  { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes swayL { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
    @keyframes swayR { from { transform: rotate(9deg); } to { transform: rotate(-9deg); } }
    @keyframes grabL { from { transform: rotate(6deg); } to { transform: rotate(-10deg); } }
    @keyframes grabR { from { transform: rotate(-6deg); } to { transform: rotate(10deg); } }
    @keyframes upper { from { transform: translateY(0); } to { transform: translateY(-9px); } }
    @keyframes lower { from { transform: translateY(0); } to { transform: translateY(16px); } }
    @keyframes glow  { from { fill: #fff23a; } to { fill: #ffffff; } }
    @keyframes dart  { 0% { transform: translateX(0); } 40% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }
    @keyframes snap  { from { transform: rotate(0deg); } to { transform: rotate(30deg); } }
    @keyframes snap2 { from { transform: rotate(0deg); } to { transform: rotate(-30deg); } }
  </style>
  <defs>
    <radialGradient id="skin" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#a6d24a"/><stop offset="0.7" stop-color="#5f9a24"/><stop offset="1" stop-color="#2c5210"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1450"/><stop offset="1" stop-color="#0d0414"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9b2c"/><stop offset="1" stop-color="#c0161b"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d8a1f"/><stop offset="0.5" stop-color="#b6d040"/><stop offset="1" stop-color="#7a1e1e"/>
    </linearGradient>
  </defs>

  <g class="bob">
    <!-- cloak -->
    <path d="M118 300 C80 380 40 470 14 520 H386 C360 470 320 380 282 300 Z" fill="url(#cloak)" stroke="#c070ff" stroke-width="2.5"/>
    <path d="M200 330 L176 520 M200 330 L224 520" stroke="#5a2470" stroke-width="2" opacity="0.6"/>
    <!-- daisies stuck to the cloak -->
    <g fill="#ff7ad9" stroke="#7a1e5a">
      <g transform="translate(120 440)"><circle cx="0" cy="-9" r="6"/><circle cx="9" cy="-3" r="6"/><circle cx="6" cy="8" r="6"/><circle cx="-6" cy="8" r="6"/><circle cx="-9" cy="-3" r="6"/><circle r="5" fill="#ffe03a"/></g>
      <g transform="translate(290 470)"><circle cx="0" cy="-9" r="6"/><circle cx="9" cy="-3" r="6"/><circle cx="6" cy="8" r="6"/><circle cx="-6" cy="8" r="6"/><circle cx="-9" cy="-3" r="6"/><circle r="5" fill="#ffe03a"/></g>
      <g transform="translate(205 400) scale(0.8)"><circle cx="0" cy="-9" r="6"/><circle cx="9" cy="-3" r="6"/><circle cx="6" cy="8" r="6"/><circle cx="-6" cy="8" r="6"/><circle cx="-9" cy="-3" r="6"/><circle r="5" fill="#ffe03a"/></g>
    </g>

    <!-- grabbing arms -->
    <g class="armL">
      <path d="M150 320 C110 330 80 310 60 280" stroke="#c070ff" stroke-width="34" fill="none" stroke-linecap="round"/>
      <path d="M150 320 C110 330 80 310 60 280" stroke="#4a1a66" stroke-width="29" fill="none" stroke-linecap="round"/>
      <g fill="#7fae3a" stroke="#1f3a0c" stroke-width="2">
        <circle cx="56" cy="274" r="15"/>
        <path d="M48 262 C36 236 30 220 18 214 C34 222 46 236 58 258 Z"/>
        <path d="M56 260 C52 230 52 212 46 196 C58 214 62 234 64 260 Z"/>
        <path d="M66 264 C74 238 80 224 90 214 C84 232 78 248 72 268 Z"/>
        <path d="M44 276 C24 270 12 262 2 250 C16 258 30 264 46 268 Z"/>
      </g>
    </g>
    <g class="armR">
      <path d="M250 320 C290 330 320 310 340 280" stroke="#c070ff" stroke-width="34" fill="none" stroke-linecap="round"/>
      <path d="M250 320 C290 330 320 310 340 280" stroke="#4a1a66" stroke-width="29" fill="none" stroke-linecap="round"/>
      <g fill="#7fae3a" stroke="#1f3a0c" stroke-width="2">
        <circle cx="344" cy="274" r="15"/>
        <path d="M352 262 C364 236 370 220 382 214 C366 222 354 236 342 258 Z"/>
        <path d="M344 260 C348 230 348 212 354 196 C342 214 338 234 336 260 Z"/>
        <path d="M334 264 C326 238 320 224 310 214 C316 232 322 248 328 268 Z"/>
        <path d="M356 276 C376 270 388 262 398 250 C384 258 370 264 354 268 Z"/>
      </g>
    </g>

    <!-- vine hair -->
    <g fill="none" stroke="#2f6b1a" stroke-width="7" stroke-linecap="round">
      <g class="hairL">
        <path d="M140 160 C110 200 130 240 100 280 C80 310 96 340 76 360"/>
        <path d="M150 165 C130 210 150 250 124 300 C110 330 122 350 110 370"/>
        <path d="M134 158 C96 180 90 220 70 240"/>
      </g>
      <g class="hairR">
        <path d="M260 160 C290 200 270 240 300 280 C320 310 304 340 324 360"/>
        <path d="M250 165 C270 210 250 250 276 300 C290 330 278 350 290 370"/>
        <path d="M266 158 C304 180 310 220 330 240"/>
      </g>
    </g>
    <g fill="#ff2a2a" stroke="#600" stroke-width="1">
      <circle cx="76" cy="360" r="5"/><circle cx="110" cy="370" r="5"/><circle cx="70" cy="240" r="5"/>
      <circle cx="324" cy="360" r="5"/><circle cx="290" cy="370" r="5"/><circle cx="330" cy="240" r="5"/>
    </g>

    <!-- face -->
    <path d="M132 220 C132 165 170 145 200 145 C230 145 268 165 268 220 C268 280 240 330 205 352 C200 355 196 355 192 350 C160 330 132 280 132 220 Z" fill="url(#skin)" stroke="#1f3a0c" stroke-width="2.5"/>
    <!-- angry brows -->
    <path d="M150 192 L192 206 M250 192 L208 206" stroke="#1a2a08" stroke-width="7" stroke-linecap="round"/>
    <!-- glowing eyes -->
    <g stroke="#3a0000" stroke-width="2">
      <path class="eye" d="M152 216 Q172 200 194 216 Q172 230 152 216 Z" fill="#fff23a"/>
      <path class="eye" d="M206 216 Q228 200 248 216 Q228 230 206 216 Z" fill="#fff23a"/>
    </g>
    <g class="pupil" fill="#d0000a">
      <ellipse cx="173" cy="216" rx="3" ry="9"/><ellipse cx="227" cy="216" rx="3" ry="9"/>
    </g>
    <!-- hooked nose with a wart -->
    <path d="M198 222 C204 240 222 262 232 280 C218 282 206 276 196 266" fill="#7aa834" stroke="#1f3a0c" stroke-width="2"/>
    <circle cx="219" cy="262" r="4.5" fill="#4f7a1c" stroke="#1f3a0c"/>

    <!-- flytrap mouth -->
    <ellipse cx="200" cy="304" rx="44" ry="16" fill="#3a0006"/>
    <g class="upper" stroke="#1f3a0c" stroke-width="2">
      <path d="M152 300 C170 284 230 284 248 300 C228 296 172 296 152 300 Z" fill="url(#jaw)"/>
      <path d="M160 297 l3 12 l5 -11 l4 12 l5 -12 l4 12 l5 -12 l4 12 l5 -12 l4 12 l5 -12 l4 12 l5 -12 l4 12 l5 -11 l3 11 l4 -11" fill="#fff7d6" stroke="#5a4a20" stroke-width="1"/>
    </g>
    <g class="lower" stroke="#1f3a0c" stroke-width="2">
      <path d="M154 306 C176 318 224 318 246 306 C232 330 168 330 154 306 Z" fill="url(#jaw)"/>
      <path d="M162 309 l3 -11 l4 11 l5 -12 l4 12 l5 -12 l4 12 l5 -12 l4 12 l5 -12 l4 12 l5 -12 l4 12 l5 -12 l4 11 l4 -11" fill="#fff7d6" stroke="#5a4a20" stroke-width="1"/>
    </g>

    <!-- crooked hat full of carnivorous flowers -->
    <g class="hat">
      <path d="M132 152 C150 100 168 50 222 18 C244 4 272 12 262 32 C236 36 240 100 270 152 Z" fill="#1f0a2c" stroke="#000" stroke-width="2"/>
      <path d="M140 136 C180 126 230 126 262 136 L266 150 C226 142 180 142 136 150 Z" fill="#8b1a6a"/>
      <ellipse cx="200" cy="152" rx="132" ry="20" fill="#2b0f3a" stroke="#000" stroke-width="2"/>
      <!-- pitcher plant in the hatband -->
      <path d="M148 140 C142 110 144 84 152 66 C156 58 168 58 170 68 C172 90 166 116 162 140 Z" fill="url(#pitch)" stroke="#2a3d10" stroke-width="2"/>
      <path d="M150 68 C156 50 176 52 174 64 C168 60 158 60 150 68 Z" fill="#8b1a1a" stroke="#2a3d10"/>
      <!-- snapping flytrap in the hatband -->
      <path d="M262 136 C262 132 262 130 262 128" stroke="#6f9b2c" stroke-width="5"/>
      <g stroke="#1f3a0c" stroke-width="2">
        <path class="snap1" d="M262 128 C240 120 232 98 242 84 C254 92 262 108 262 128 Z" fill="#c0161b"/>
        <path class="snap2" d="M262 128 C284 120 292 98 282 84 C270 92 262 108 262 128 Z" fill="#c0161b"/>
      </g>
      <!-- sundew blooms -->
      <g fill="#ff4fa3" stroke="#7a1e5a">
        <circle cx="196" cy="130" r="7"/><circle cx="214" cy="126" r="6"/><circle cx="230" cy="132" r="7"/>
      </g>
      <g fill="#fffbd0"><circle cx="196" cy="130" r="2.5"/><circle cx="214" cy="126" r="2"/><circle cx="230" cy="132" r="2.5"/></g>
    </g>
  </g>
</svg>
