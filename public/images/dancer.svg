<svg xmlns="http://www.w3.org/2000/svg" width="300" height="460" viewBox="0 0 300 460">
  <style>
    .all   { animation: lean 0.31s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 150px 440px; }
    .hat   { animation: tip 0.62s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 150px 82px; }
    .reach { animation: point 0.31s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 122px 142px; }
    .eat   { animation: munch 0.19s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 196px 192px; }
    .legA  { animation: slideA 0.50s linear infinite; }
    .legB  { animation: slideA 0.50s linear infinite; animation-delay: -0.25s; }
    .heelA { animation: heel 0.50s linear infinite; transform-box: fill-box; transform-origin: 100% 100%; }
    .heelB { animation: heel 0.50s linear infinite; animation-delay: -0.25s; transform-box: fill-box; transform-origin: 100% 100%; }
    .spark { animation: twinkle 0.25s steps(2) infinite alternate; }
    .spark2 { animation: twinkle 0.25s steps(2) infinite alternate-reverse; }
    .bits circle { animation: crumbs 0.37s ease-out infinite; }
    .bits circle:nth-child(2) { animation-delay: -0.12s; }
    .bits circle:nth-child(3) { animation-delay: -0.25s; }
    .bits circle:nth-child(4) { animation-delay: -0.06s; }
    @keyframes lean   { from { transform: rotate(-3deg); } to { transform: rotate(4deg) translateY(-4px); } }
    @keyframes tip    { from { transform: rotate(-12deg); } to { transform: rotate(-4deg); } }
    @keyframes point  { from { transform: rotate(0deg); } to { transform: rotate(-18deg); } }
    @keyframes munch  { from { transform: rotate(0deg); } to { transform: rotate(-16deg); } }
    /* moonwalk: each foot slides backward flat, then hops forward on its toes */
    @keyframes slideA { 0% { transform: translateX(14px); } 50% { transform: translateX(-14px); } 100% { transform: translateX(14px); } }
    @keyframes heel   { 0%, 50% { transform: rotate(0deg); } 60%, 90% { transform: rotate(-22deg); } 100% { transform: rotate(0deg); } }
    @keyframes twinkle { from { opacity: 1; } to { opacity: 0.15; } }
    @keyframes crumbs { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(30px, -26px); opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="glove" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d4e6"/>
    </radialGradient>
  </defs>
  <!-- floor shadow -->
  <ellipse cx="150" cy="446" rx="70" ry="9" fill="#000" opacity="0.35"/>

  <g class="all">
    <!-- legs: skinny black pants, short enough to flash the white socks -->
    <g class="legA">
      <path d="M134 250 L128 400 L144 400 L150 260 Z" fill="#111" stroke="#555" stroke-width="1.5"/>
      <rect x="128" y="398" width="16" height="18" fill="#ffffff" stroke="#888" stroke-width="1"/>
      <g class="heelA"><path d="M126 414 L146 414 C158 414 166 420 166 428 L124 428 C122 422 123 416 126 414 Z" fill="#111" stroke="#555" stroke-width="1.5"/></g>
    </g>
    <g class="legB">
      <path d="M150 260 L156 400 L172 400 L166 250 Z" fill="#111" stroke="#555" stroke-width="1.5"/>
      <rect x="156" y="398" width="16" height="18" fill="#ffffff" stroke="#888" stroke-width="1"/>
      <g class="heelB"><path d="M154 414 L174 414 C186 414 194 420 194 428 L152 428 C150 422 151 416 154 414 Z" fill="#111" stroke="#555" stroke-width="1.5"/></g>
    </g>

    <!-- jacket -->
    <path d="M120 138 C116 180 122 220 128 256 L172 256 C178 220 184 180 180 138 C166 130 134 130 120 138 Z" fill="#141414" stroke="#444" stroke-width="1.5"/>
    <path d="M140 136 L150 178 L160 136 Z" fill="#ffffff"/>
    <rect x="126" y="236" width="48" height="8" fill="#2a2a2a"/>
    <rect x="146" y="235" width="8" height="10" fill="#d4af37"/>
    <g fill="#ffe680">
      <circle class="spark" cx="130" cy="160" r="1.8"/><circle class="spark2" cx="168" cy="170" r="1.8"/>
      <circle class="spark" cx="138" cy="208" r="1.8"/><circle class="spark2" cx="164" cy="222" r="1.8"/>
      <circle class="spark2" cx="126" cy="190" r="1.5"/><circle class="spark" cx="174" cy="198" r="1.5"/>
    </g>

    <!-- the arm with the sparkly glove, pointing at the sky -->
    <g class="reach">
      <path d="M124 144 C108 120 100 96 94 70" stroke="#141414" stroke-width="16" fill="none" stroke-linecap="round"/>
      <rect x="99" y="104" width="18" height="9" fill="#ffffff" transform="rotate(-28 108 108)"/>
      <g>
        <ellipse cx="92" cy="60" rx="11" ry="14" fill="url(#glove)" stroke="#8a9ab8" stroke-width="1.5"/>
        <path d="M88 48 L86 28" stroke="url(#glove)" stroke-width="7" stroke-linecap="round"/>
        <path d="M88 48 L86 28" stroke="#8a9ab8" stroke-width="1" fill="none"/>
      </g>
      <g fill="#ffffff" stroke="#9fd8ff" stroke-width="1">
        <path class="spark" d="M76 44 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 Z"/>
        <path class="spark2" d="M104 40 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z"/>
      </g>
    </g>

    <!-- head under the fedora, all in shadow -->
    <path d="M140 118 L140 136 L160 136 L160 118 Z" fill="#141414"/>
    <ellipse cx="150" cy="104" rx="20" ry="24" fill="#141414"/>
    <path d="M132 96 C124 110 128 126 122 136 M168 96 C176 110 172 126 178 136" stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- the hungry arm, stuffing a flytrap in his mouth -->
    <g class="eat">
      <path d="M178 144 C196 160 204 180 196 192 C186 200 176 160 168 120" stroke="#141414" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="168" cy="118" r="7" fill="#141414" stroke="#444" stroke-width="1"/>
      <path d="M170 116 C180 100 186 86 196 74" stroke="#5c8a22" stroke-width="4" fill="none"/>
      <path d="M196 74 C186 60 190 44 202 40 C206 54 204 66 196 74 Z" fill="#c0161b" stroke="#1f3a0c" stroke-width="1.5"/>
      <path d="M196 74 C212 70 222 58 220 46 C208 50 200 60 196 74 Z" fill="#7fb03a" stroke="#1f3a0c" stroke-width="1.5"/>
      <path d="M178 104 C170 96 162 98 158 104 C166 108 172 108 178 104 Z" fill="#6f9b2c"/>
    </g>
    <g class="bits" fill="#7fc03a">
      <circle cx="166" cy="112" r="3"/><circle cx="168" cy="108" r="2.2"/><circle cx="164" cy="116" r="2.5"/><circle cx="170" cy="112" r="1.8"/>
    </g>

    <!-- the fedora, tipped low over the eyes -->
    <g class="hat">
      <path d="M126 82 C126 58 134 48 150 48 C166 48 174 58 174 82 Z" fill="#111" stroke="#444" stroke-width="1.5"/>
      <path d="M150 50 C146 60 146 70 150 76" stroke="#333" stroke-width="2" fill="none"/>
      <rect x="126" y="72" width="48" height="8" fill="#2c2c2c"/>
      <ellipse cx="150" cy="84" rx="44" ry="8" fill="#111" stroke="#444" stroke-width="1.5"/>
    </g>
  </g>
</svg>
